version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dr-natures-db
    restart: always
    environment:
      POSTGRES_USER: drnatures
      POSTGRES_PASSWORD: drnatures_dev_password
      POSTGRES_DB: drnatures_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drnatures -d drnatures_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dr-natures-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
